<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anode Rejection Report</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:480px;margin:0 auto;padding:16px;background:#f4f5f7;color:#222}
  h2{margin:0 0 12px}
  .row{display:flex;gap:8px}.row>*{flex:1}
  label{display:block;font-size:13px;margin:10px 0 3px;color:#555}
  input,select{width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1px solid #bbb;border-radius:6px}
  input:disabled{background:#e9e9e9}
  button{padding:12px;font-size:16px;border:0;border-radius:6px;background:#0b5ed7;color:#fff;width:100%;margin-top:12px}
  button:disabled{background:#999}
  button.alt{background:#198754}
  .tabs{display:flex;margin:14px 0 0}.tabs button{margin:0;border-radius:6px 6px 0 0;background:#ccd}
  .tabs button.on{background:#0b5ed7}
  .panel{background:#fff;padding:12px;border:1px solid #ccc;border-radius:0 0 6px 6px}
  .st{padding:8px;border-radius:6px;font-size:13px;margin-top:10px}
  .st.open{background:#d1e7dd}.st.locked{background:#f8d7da}.st.future{background:#fff3cd}
  pre{white-space:pre-wrap;font-size:14px;margin:0}
  details{margin-top:12px;font-size:13px;color:#666}
  #msg{font-size:13px;color:#666;min-height:18px;margin-top:8px}
</style>
</head>
<body>
<h2>Anode Rejection Report</h2>
<div class="row">
  <div><label>Date</label><input type="date" id="date"></div>
  <div><label>Shift</label><select id="shift"><option>A</option><option>B</option><option>C</option></select></div>
</div>
<div id="status" class="st"></div>

<div class="tabs">
  <button id="t-form" class="on" onclick="tab('form')">Enter data</button>
  <button id="t-view" onclick="tab('view')">View report</button>
</div>

<div class="panel" id="p-form">
  <label>UP (this shift)</label><input type="number" min="0" id="up">
  <label>OP (this shift)</label><input type="number" min="0" id="op">
  <label>CRACK (this shift)</label><input type="number" min="0" id="crack">
  <label>STICKY COKE (this shift)</label><input type="number" min="0" id="sticky">
  <label>Damaged anode (this shift)</label><input type="number" min="0" id="damaged">
  <button id="save" onclick="save()">Save &amp; show report</button>
  <details><summary>Admin override</summary><input type="password" id="pin" placeholder="Admin PIN" oninput="render()"></details>
</div>

<div class="panel" id="p-view" hidden>
  <pre id="out"></pre>
  <button class="alt" onclick="copyTxt()">Copy</button>
  <button class="alt" onclick="wa()">Send via WhatsApp</button>
</div>
<div id="msg"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbw-WNfV0DEEAhjBxDbmLHulC-y9pYczl5kyOXSQ2auy7h8r0i2opcCWMTgZC7zANEiY/exec';   // Apps Script /exec URL
const F = ['up','op','crack','sticky','damaged'];
const $ = id => document.getElementById(id);
let cur = null;

function tab(t){
  $('p-form').hidden = t !== 'form'; $('p-view').hidden = t !== 'view';
  $('t-form').className = t === 'form' ? 'on' : ''; $('t-view').className = t === 'view' ? 'on' : '';
}

async function load(first){
  $('msg').textContent = 'Loading...';
  try {
    const q = first ? '' : `?date=${$('date').value}&shift=${$('shift').value}`;
    const r = await (await fetch(API + q)).json();
    if (r.error) throw new Error(r.error);
    cur = r; $('date').value = r.date; $('shift').value = r.shift;
    F.forEach(f => $(f).value = r.fts[f]);
    $('out').textContent = r.text;
    render();
  } catch(e){ $('msg').textContent = 'Error: ' + e.message; }
}

function render(){
  if (!cur) return;
  const ok = cur.state === 'open' || $('pin').value;
  F.forEach(f => $(f).disabled = !ok); $('save').disabled = !ok;
  $('status').className = 'st ' + cur.state;
  $('status').textContent = cur.state === 'open' ? `Open - entry/edit allowed until ${cur.deadline}`
    : cur.state === 'locked' ? `Locked - closed at ${cur.deadline}` : 'Shift not started yet';
  $('msg').textContent = cur.found ? '' : 'No data submitted for this shift yet.';
}

async function save(){
  const vals = {}; F.forEach(f => vals[f] = $(f).value);
  $('msg').textContent = 'Saving...';
  try {
    const r = await (await fetch(API, { method: 'POST',
      body: JSON.stringify({ date: $('date').value, shift: $('shift').value, vals, pin: $('pin').value }) })).json();
    if (r.error) throw new Error(r.error);
    cur = r; $('out').textContent = r.text; render();
    $('msg').textContent = 'Saved.'; tab('view');
  } catch(e){ $('msg').textContent = 'Error: ' + e.message; }
}

function copyTxt(){
  const t = document.createElement('textarea'); t.value = $('out').textContent;
  document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
  $('msg').textContent = 'Copied.';
}
function wa(){ window.open('https://wa.me/?text=' + encodeURIComponent($('out').textContent), '_blank'); }

$('date').onchange = $('shift').onchange = () => load(false);
load(true);
</script>
</body>
</html>
