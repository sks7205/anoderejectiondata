<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anode Rejection Report</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;max-width:540px;margin:0 auto;padding:16px;background:#f4f5f7;color:#222}
  h2{margin:0 0 12px;font-size:20px}
  .row{display:flex;gap:8px}.row>*{flex:1}
  label{display:block;font-size:13px;margin:10px 0 3px;color:#555;font-weight:600}
  input,select{width:100%;box-sizing:border-box;padding:10px;font-size:15px;border:1px solid #bbb;border-radius:6px}
  input:disabled{background:#e9e9e9}
  button{padding:12px;font-size:15px;border:0;border-radius:6px;background:#0b5ed7;color:#fff;width:100%;margin-top:12px;cursor:pointer;font-weight:600}
  button:disabled{background:#999;cursor:not-allowed}
  button.alt{background:#198754}
  .tabs{display:flex;margin:14px 0 0}.tabs button{margin:0;border-radius:6px 6px 0 0;background:#ccd;color:#333;font-size:13px;padding:9px}
  .tabs button.on{background:#0b5ed7;color:#fff}
  .panel{background:#fff;padding:14px;border:1px solid #ccc;border-radius:0 0 6px 6px}
  .st{padding:8px 12px;border-radius:6px;font-size:13px;margin-top:10px}
  .st.open{background:#d1e7dd;color:#0f5132}.st.locked{background:#f8d7da;color:#842029}.st.future{background:#fff3cd;color:#664d03}
  .incharge-badge{display:inline-block;padding:2px 8px;border-radius:12px;background:#e7f1ff;color:#0c63e4;font-size:12px;font-weight:bold;margin-top:4px}
  pre{white-space:pre-wrap;font-size:13px;margin:0;background:#fafafa;padding:10px;border-radius:4px;border:1px solid #eee}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
  th,td{border:1px solid #ddd;padding:6px;text-align:center}
  th{background:#f0f2f5}
  details{margin-top:12px;font-size:13px;color:#666}
  #msg{font-size:13px;color:#d32f2f;min-height:18px;margin-top:8px;font-weight:500}
</style>
</head>
<body>
<h2>Anode Rejection Report</h2>
<div class="row">
  <div><label>Date</label><input type="date" id="date"></div>
  <div><label>Shift</label><select id="shift"><option>A</option><option>B</option><option>C</option></select></div>
</div>
<div id="ic-label">Incharge: <span id="incharge" class="incharge-badge">--</span></div>
<div id="status" class="st"></div>

<div class="tabs">
  <button id="t-form" class="on" onclick="tab('form')">Enter data</button>
  <button id="t-view" onclick="tab('view')">View report</button>
  <button id="t-stats" onclick="tab('stats')">Analytics (MTD)</button>
</div>

<div class="panel" id="p-form">
  <label>UP (this shift)</label><input type="number" min="0" id="up">
  <label>OP (this shift)</label><input type="number" min="0" id="op">
  <label>CRACK (this shift)</label><input type="number" min="0" id="crack">
  <label>STICKY COKE (this shift)</label><input type="number" min="0" id="sticky">
  <label>Damaged anode (this shift)</label><input type="number" min="0" id="damaged">
  <label>PIN FAIL (this shift)</label><input type="number" min="0" id="pinfail">
  <button id="save" onclick="save()">Save &amp; show report</button>
  <details>
    <summary>Admin override</summary>
    <input type="password" id="pin" placeholder="Admin PIN" oninput="render()">
  </details>
</div>

<div class="panel" id="p-view" hidden>
  <pre id="out"></pre>
  <button class="alt" onclick="copyTxt()">Copy Text</button>
  <button class="alt" onclick="wa()">Send via WhatsApp</button>
</div>

<div class="panel" id="p-stats" hidden>
  <h3 style="margin-top:0;font-size:15px">Month-to-Date: <span id="stat-month"></span></h3>
  <b>Category Totals</b>
  <table id="tbl-cat">
    <tr><th>Category</th><th>Total (MTD)</th></tr>
  </table>
  <br>
  <b>Shift Incharge Performance (MTD)</b>
  <table id="tbl-ic">
    <tr><th>Incharge</th><th>UP</th><th>OP</th><th>CRK</th><th>STK</th><th>DMG</th><th>PIN</th><th>Total</th></tr>
  </table>
</div>

<div id="msg"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbw-WNfV0DEEAhjBxDbmLHulC-y9pYczl5kyOXSQ2auy7h8r0i2opcCWMTgZC7zANEiY/exec';
const F = ['up', 'op', 'crack', 'sticky', 'damaged', 'pinfail'];
const LABELS = ['UP', 'OP', 'CRACK', 'STICKY COKE', 'Damaged anode', 'PIN FAIL'];
const $ = id => document.getElementById(id);
let cur = null;

function tab(t){
  $('p-form').hidden = t !== 'form';$('p-view').hidden = t !== 'view';
  $('p-stats').hidden = t !== 'stats';$('t-form').className = t === 'form' ? 'on' : '';
  $('t-view').className = t === 'view' ? 'on' : '';$('t-stats').className = t === 'stats' ? 'on' : '';
}

async function load(first){
  $('msg').style.color = '#555';
  $('msg').textContent = 'Loading...';
  try {
    const q = first ? '' : `?date=${$('date').value}&shift=${$('shift').value}`;
    const r = await (await fetch(API + q)).json();
    if (r.error) throw new Error(r.error);
    cur = r;
    $('date').value = r.date;
    $('shift').value = r.shift;
    $('incharge').textContent = r.incharge || '--';
    F.forEach(f => $(f).value = r.fts[f] ?? 0);$('out').textContent = r.text;
    render();
    renderStats(r);
  } catch(e){
    $('msg').style.color = '#d32f2f';
    $('msg').textContent = 'Error: ' + e.message;
  }
}

function render(){
  if (!cur) return;
  const ok = cur.state === 'open' || $('pin').value;
  F.forEach(f => $(f).disabled = !ok);$('save').disabled = !ok;
  $('status').className = 'st ' + cur.state;
  $('status').textContent = cur.state === 'open' ? `Open - entry allowed until ${cur.deadline}`
    : cur.state === 'locked' ? `Locked - closed at ${cur.deadline}` : 'Shift not started yet';
  $('msg').style.color = '#555';
  $('msg').textContent = cur.found ? '' : 'No data submitted for this shift yet.';
}

function renderStats(r){
  if (!r.mtd) return;
  $('stat-month').textContent = r.month;
  
  let catHtml = '<tr><th>Category</th><th>Total (MTD)</th></tr>';
  F.forEach((f, i) => {
    catHtml += `<tr><td>${LABELS[i]}</td><td><b>${r.mtd[f] || 0}</b></td></tr>`;
  });
  $('tbl-cat').innerHTML = catHtml;

  let icHtml = '<tr><th>Incharge</th><th>UP</th><th>OP</th><th>CRK</th><th>STK</th><th>DMG</th><th>PIN</th><th>Total</th></tr>';
  const icData = r.inchargeStats || {};
  Object.keys(icData).forEach(ic => {
    const row = icData[ic];
    icHtml += `<tr>
      <td><b>${ic}</b></td>
      <td>${row.up || 0}</td>
      <td>${row.op || 0}</td>
      <td>${row.crack || 0}</td>
      <td>${row.sticky || 0}</td>
      <td>${row.damaged || 0}</td>
      <td>${row.pinfail || 0}</td>
      <td><b>${row.total || 0}</b></td>
    </tr>`;
  });
  $('tbl-ic').innerHTML = icHtml;
}

async function save(){
  const vals = {};
  F.forEach(f => vals[f] = $(f).value);$('msg').style.color = '#555';
  $('msg').textContent = 'Saving...';
  try {
    const r = await (await fetch(API, {
      method: 'POST',
      body: JSON.stringify({ date: $('date').value, shift: $('shift').value, vals, pin:$('pin').value })
    })).json();
    if (r.error) throw new Error(r.error);
    cur = r;
    $('out').textContent = r.text;
    render();
    renderStats(r);
    $('msg').style.color = '#198754';
    $('msg').textContent = 'Saved successfully.';
    tab('view');
  } catch(e){
    $('msg').style.color = '#d32f2f';
    $('msg').textContent = e.message;
  }
}

function copyTxt(){
  const t = document.createElement('textarea');
  t.value = $('out').textContent;
  document.body.appendChild(t);
  t.select();
  document.execCommand('copy');
  t.remove();
  $('msg').style.color = '#198754';
  $('msg').textContent = 'Copied to clipboard.';
}

function wa(){
  window.open('https://wa.me/?text=' + encodeURIComponent($('out').textContent), '_blank');
}

$('date').onchange =$('shift').onchange = () => load(false);
load(true);
</script>
</body>
</html>
